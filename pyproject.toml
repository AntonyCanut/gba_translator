[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gba-translator"
version = "0.1.0"
description = "GBA ROM translation toolkit (EN→FR) for Pokemon Unbound / CFRU"
requires-python = ">=3.11"
# pyyaml drives the multi-language registry (src/i18n/registry.py) used by the
# generic IT/DE builds. Without it `make build-it` crashes in CI with
# ModuleNotFoundError even though a dev's local env happens to have it installed.
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "benchmark: benchmarks de performance",
    "stress: tests de stress (long, >30min)",
    "slow: tests lents (>30s)",
    "emulator: necessite mGBA",
    "rom: necessite une ROM GBA",
]
# Profils d'execution :
# Rapide (unit)                : python3 -m pytest tests/ -x --ignore=tests/benchmarks --ignore=tests/e2e -m "not slow and not stress and not emulator"
# Standard (unit+integration)  : python3 -m pytest tests/ --ignore=tests/benchmarks -m "not slow and not stress and not emulator"
# Complet                      : python3 -m pytest tests/ -v
# CI (sans emulateur)          : python3 -m pytest tests/ -m "not emulator and not stress and not benchmark" -v
# Benchmarks                   : python3 -m pytest tests/benchmarks/ -v -s
# Stress                       : python3 -m pytest tests/ -m "stress" -v
