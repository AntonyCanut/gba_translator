# Entrées protégées IT — SOURCE DE VÉRITÉ des corrections validées (issues/tickets).
#
# scripts/check_translation_integrity.py vérifie que combined_it.txt (règle
# last-wins, comme la chaîne de build) résout chaque offset EXACTEMENT à
# `expected` (ou qu'il reste ABSENT si `absent: true`). Toute divergence fait
# échouer le pre-commit (make test-python-fast) ET make build-it.
#
# - Correction volontaire d'une entrée protégée → mettre à jour `expected` ici
#   DANS LE MÊME COMMIT que combined_it.txt.
# - Fix perdu (snapshot périmé, Pattern C) → python3 scripts/check_translation_integrity.py --fix --lang it
# - Toute entrée déjà perdue une fois par un commit périmé DOIT être ajoutée ici.
#
# Format d'une entrée :
#   - offset: "0x123456"
#     name: "Description courte"
#     issue: "#NN"                       # optionnel
#     expected: 'Texte exact attendu'    # quoting simple : \n reste littéral
#     forbidden: ['Forme périmée']       # optionnel, message d'erreur plus clair
#   # ou, pour un offset qui doit rester absent du fichier :
#   - offset: "0x123456"
#     name: "..."
#     absent: true
#
# Voir docs/20_TRANSLATION_PRESERVATION.md §7.
entries:
- offset: '0x1f53f7c'
  name: 'PNJ Centro Pokémon: Cootes con pochi Pokémon Coleottero'
  issue: B-303
  expected: 'Per essere una palude, <0xFC><0x01><0x06>Cootes<0xFC><0x01><0x08>\nsorprendentemente non ospita molti\lPokémon di tipo Coleottero.'
  forbidden:
  - Cootes Bog
- offset: '0x1f478ee'
  name: 'Rivale : battuta post-lotta Krookodile'
  issue: B-302
  expected: 'Cavolo<0xB0> di cosa mi preoccupavo?\nCerto che sei pronto!'
  forbidden:
  - Man… what was I even worried about?
