# Italian language descriptor — Pokémon Unbound EN→IT
#
# WORK IN PROGRESS. Italian is built by the generic driver
# `scripts/build_language.py it`. Translations live in
# languages/it/combined_it.txt (same `<offset_hex>: <text>` format as
# combined_fr.txt). Offsets not present there stay English.
code: it
name: Italian
native_name: Italiano
builder_language: italian         # value passed to the generic builder --language
status: in_progress               # complete | in_progress
build: generic                    # dedicated (make build-fr) | generic (build_language.py)

combined: languages/it/combined_it.txt
critical: languages/it/critical_strings_it.txt   # optional; created when needed
output_rom: GenedRom-it.gba
# Shown in-game on the NOT FOR SALE screen as IT.2.1.<build> (the trailing
# component is the CI build number stamped by the `version` patch step).
version_label: IT.2.1.0

# Extra glyphs the font must render beyond plain ASCII.
# Italian only needs grave/acute vowels — all already covered by the FR font
# glyph set, so the shared font patch applies cleanly.
font_glyphs: "àèéìíîòóùúÀÈÉÌÒÙ"

# In-game status-condition abbreviations (official IT localisation).
status_abbrev:
  poison: PSN
  burn: SCT
  freeze: CON
  paralysis: PAR
  sleep: SON
  faint: KO

# Post-build patches applied by scripts/build_language.py.
#
# Anti-freeze / anti-corruption (language-agnostic mechanics — always applied):
#   repair_lz77            restore stable EN=ES LZ77 UI blocks corrupted by the builder
#   repair_localized_lz77  copy localized (EN≠ES) LZ77 blocks from the Spanish ROM
#   repoint_stale          re-target text pointers reverted by the LZ77 repair passes
#   legendary_ritual       restore Ho-Oh/Lugia cutscene setflag chain clobbered by repointer
#
# Language-aware (data already in status_abbrev above):
#   status_abbrevs         write IT status abbreviations (SCT/CON/SON/…) into ROM
#   status_badges           redraw the in-battle status badge tiles (LZ77, not
#                           text) with SON/CON/SCT via patch_status_badges_it.py;
#                           PSN/PAR are left untouched (already read correctly).
#   type_icons              redraw the move-type pill badges (LZ77 tiles) with
#                           Italian type names via patch_type_icons_it.py.
#   hp_labels               redraw the HP-label graphics (party menu + summary
#                           bar + summary grey stat label — all LZ77 tiles, not
#                           text) with the Italian « PS » (Punti Salute) via
#                           languages/it/patches/hp_labels.py. The summary bar
#                           block already gets the Spanish « PS » art from
#                           repair_localized_lz77, but the party-menu and
#                           summary-grey blocks are EN==ES stable and still
#                           show English « HP » without this patch; it also
#                           redraws the summary bar so all three share one
#                           consistent font.
#   dexnav_headers          redraw the 4 DexNav column headers (LZ77 tiles) with
#                           LIVELLO RIC / METODO / AB. NASCOSTA / OGGETTI via
#                           patch_dexnav_headers_it.py.
#   version                stamp the NOT FOR SALE screen with IT.2.1.<build>
#                          so the running build advertises it is the Italian one
#   pokedex_categories      translate the species-category table ("<cat> Pokémon")
#                           from languages/it/data/pokedex_categories_it.json.
#   pokedex_category_order  swap category/"Pokémon" print order to the Italian
#                           "Pokémon <cat>" form (language-agnostic ASM swap).
#   pokedex_category_order  MUST run after pokedex_categories (reads the same table).
#   pokedex_metrics         convert Pokédex height/weight to metric with Italian
#                           "Al"/"Pe" (Altezza/Peso) labels.
#   pokedex_rewrap          re-wrap Pokédex descriptions to the 3-line info window
#                           (language-agnostic, works on whatever combined_it.txt
#                           already translated).
#
# Guard-only (no ROM mutation, verifies the pipeline's own output):
#   battle_prefix           Italian wild/foe prefix cells in combined_it.txt are
#                           already full phrases ("Il Pokémon selvatico"), so no
#                           code-cave word-order rewrite is applied here (see
#                           patch_battle_prefix_it.py for the follow-up note).
#
# In-place patches ported from the French pipeline (F-85). Each has a thin
# languages/it/patches/<name>.py wrapper that delegates to the language-agnostic
# patch_<name>_fr.py via src/i18n/fr_patch_delegate; build_language.py resolves
# it ahead of the shared FR branches (_lang_patch_script) and invokes it with a
# single --rom, the wrapper resolving its Italian data source internally:
#   summary_labels          restore the Type/OT/Item summary-label tilemap +
#                           localized tileset from the pristine EN ROM.
#   battle_string_templates restore the {FD24} defeat-speech / switch-out
#                           control-code cluster from the pristine EN ROM.
#   givecs_gift_item        restore the give-CS 44-byte gift-item struct from EN.
#   ability_names           write Italian ability names into the fixed 17-byte
#                           table from combined_it.txt (over-long names skipped,
#                           never corrupted).
#   move_names              write Italian move names into the real fixed
#                           13-byte move-name table (0x1B2980, 894 entries).
#                           combined_it.txt's move-name text was authored
#                           against a stale, non-live "legacy" offset
#                           (0xA40A10) that actually sits inside the generic
#                           builder's Pokédex free-space pool; this patch
#                           remaps each entry by index to the real table
#                           instead (see languages/fr/patches/move_names.py).
#                           Every sampled build — including the pristine EN
#                           reference ROM — ships this table pre-filled with
#                           French names, so without this patch IT currently
#                           shows French move names, not English.
#   tm_item_descriptions    anti-freeze pass: terminate/relocate the MT/MN item
#                           descriptions in place, sourced from combined_it.txt.
#
# NOT wired: the free-space-relocation ports (dup_move_descriptions,
# meteorite_dialogue, mission_descriptions, move_descriptions, pokedex) — the
# generic builder already consumes the ROM's free space, so those FR relocation
# patches report FAILED (free space) and abort the build. Their patch_*_it.py
# wrappers exist on disk but stay unwired (tracked as a follow-up); Pokédex
# descriptions are instead handled in place by the `pokedex_rewrap` step below.
#
# In-place hardcoded-text patches (group A, F-96): each authors Italian text
# within a fixed byte/pixel budget (never relocated via the shared free-space
# builder, except battle_recall_strings/shop which use their own small,
# independent free-space search — see the module docstrings):
#   gendered_buffers        figlia/uom/dama/donna/lei buffers (FD03 gender
#                           variable, positional mapping); son/boy/girl left
#                           English — no 3/4-letter Italian word fits the slot.
#   cfru_type_names         packed type-name table + frozen-status word "gel",
#                           abbreviated to fit the English-original slot width.
#   item_names               official Italian Berry/item names for the inline
#                           13-glyph name cells the pipeline never reaches.
#   options_footer           Options-menu page-2 button legend (Scegli/Cambia/
#                           OK/Extra), packed in-place against the next string.
#   battle_recall_strings    trainer "come back!" messages -> torna!/tornate!,
#                           relocated via a small dedicated free-space scan.
#   cry_label               Pokémon-list "Cry" menu entry -> "Grido" (B-188):
#                           "Grido" (5 glyphs) overflows the fixed 3-glyph
#                           cell, so this relocates the body to free space
#                           and repoints its two known external pointers
#                           (0x105FE4 / 0x1067B8) via languages/it/patches/
#                           cry_label.py — same mechanism as battle_recall_strings.
#   time_format               12h->24h + DD/MM/YYYY templates, IT weekdays
#                           (Dom/Lun/Mar/Mer/Gio/Ven/Sab) and 12 month
#                           abbreviations (already in combined_it.txt at their
#                           classic fixed offsets). The save-screen date
#                           template is patched wherever the live 0x1EB6260
#                           pointer resolves to (see the module docstring —
#                           the IT pipeline's own translate pass can relocate
#                           a copy of it before this script ever runs).
#   trainer_card_date         Trainer Card date in Day Month Year order; reuses
#                           the language-neutral FR/DE builder verbatim and
#                           depends on time_format's month cells.
#   shop                     "Buy"/"In Cube:" text; "Buy" is relocated via a
#                           dynamic free-space allocator and degrades to a
#                           warning (stays English) rather than aborting the
#                           build when the generic builder has no free space
#                           left by the time this step runs.
patches:
  - font
  - gendered_buffers
  - time_format
  - inline
  - battle_prefix
  - battle_recall_strings
  - cry_label               # relocate+repoint "Cry"→"Grido" (B-188, over-cap for the fixed cell)
  - repair_lz77
  - repair_localized_lz77
  # ── Structural restores from the pristine EN/ES ROMs (language-agnostic) ──
  - summary_labels          # Type/OT/Item label tilemap + localized tileset
  - repoint_stale
  - legendary_ritual
  - givecs_gift_item        # guard the give-CS gift item 44-byte struct
  - battle_string_templates # {FD24} defeat-speech / switch-out control cluster
  - intro_questions_it   # fix 3 character-creation questions that bypass pipeline
  - trainer_class_names_it  # inject IT gTrainerClassNames cells (no-pointer table)
  - long_dialogues_it       # relocate/repoint dialogues over the extractor cap
  - status_abbrevs
  # ── Italian text written in place (no free-space relocation) ──────────────
  - ability_names           # fixed 17-byte ability-name table ← combined_it
  - move_names              # real fixed 13-byte move-name table (0x1B2980)
  - tm_item_descriptions    # MT/MN item descriptions (anti-freeze, in place)
  - item_names
  - cfru_type_names
  - options_footer
  - shop
  # ── Graphics (LZ77 tiles) + Pokédex tables ────────────────────────────────
  - status_badges
  - type_icons
  - hp_labels
  - dexnav_headers
  - version
  - pokedex_categories
  - pokedex_category_order
  - pokedex_metrics
  - pokedex_rewrap
  - trainer_card_date
  # Post-build audit: flag any translated cell not terminated before its
  # neighbour (fusion / freeze risk). Report-only, never fails the build.
  - collision_check
