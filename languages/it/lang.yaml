# Italian language descriptor — Pokémon Unbound EN→IT
#
# WORK IN PROGRESS. Italian is built by the generic driver
# `scripts/build_language.py it`. Translations live in
# languages/it/combined_it.txt (same `<offset_hex>: <text>` format as
# combined_fr.txt). Offsets not present there stay English.
code: it
name: Italian
native_name: Italiano
builder_language: italian         # value passed to the generic builder --language
status: in_progress               # complete | in_progress
build: generic                    # dedicated (make build-fr) | generic (build_language.py)

combined: languages/it/combined_it.txt
critical: languages/it/critical_strings_it.txt   # optional; created when needed
output_rom: GenedRom-it.gba
# Shown in-game on the NOT FOR SALE screen as IT.2.1.<build> (the trailing
# component is the CI build number stamped by the `version` patch step).
version_label: IT.2.1.0

# Extra glyphs the font must render beyond plain ASCII.
# Italian only needs grave/acute vowels — all already covered by the FR font
# glyph set, so the shared font patch applies cleanly.
font_glyphs: "àèéìíîòóùúÀÈÉÌÒÙ"

# In-game status-condition abbreviations (official IT localisation).
status_abbrev:
  poison: PSN
  burn: SCT
  freeze: CON
  paralysis: PAR
  sleep: SON
  faint: KO

# Post-build patches applied by scripts/build_language.py.
#
# Anti-freeze / anti-corruption (language-agnostic mechanics — always applied):
#   repair_lz77            restore stable EN=ES LZ77 UI blocks corrupted by the builder
#   repair_localized_lz77  copy localized (EN≠ES) LZ77 blocks from the Spanish ROM
#   repoint_stale          re-target text pointers reverted by the LZ77 repair passes
#   legendary_ritual       restore Ho-Oh/Lugia cutscene setflag chain clobbered by repointer
#
# Language-aware (data already in status_abbrev above):
#   status_abbrevs         write IT status abbreviations (SCT/CON/SON/…) into ROM
#   version                stamp the NOT FOR SALE screen with IT.2.1.<build>
#                          so the running build advertises it is the Italian one
#
# Richer passes (pokédex rewrap, mission boxes, move descriptions, …) will be
# added here as Italian translations for those subsystems mature.
patches:
  - font
  - inline
  - repair_lz77
  - repair_localized_lz77
  - repoint_stale
  - legendary_ritual
  - intro_questions_it   # fix 3 character-creation questions that bypass pipeline
  - status_abbrevs
  - version
  # Post-build audit: flag any translated cell not terminated before its
  # neighbour (fusion / freeze risk). Report-only, never fails the build.
  - collision_check
