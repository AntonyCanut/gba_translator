# German language descriptor — Pokémon Unbound EN→DE
#
# WORK IN PROGRESS. German is built by the generic driver
# `scripts/build_language.py de`. Translations live in
# languages/de/combined_de.txt (same `<offset_hex>: <text>` format as
# combined_fr.txt). Offsets not present there stay English.
#
# ä ö ü Ä Ö Ü are now in the charmap (slots 0x63-0x60) and have glyphs
# drawn by scripts/patch_font_de.py, so the `font` step is active.
code: de
name: German
native_name: Deutsch
builder_language: german          # value passed to the generic builder --language
status: in_progress               # complete | in_progress
build: generic                    # dedicated (make build-fr) | generic (build_language.py)

combined: languages/de/combined_de.txt
critical: languages/de/critical_strings_de.txt   # optional; created when needed
output_rom: GenedRom-de.gba
# Shown in-game on the NOT FOR SALE screen as DE.2.1.<build> (the trailing
# component is the CI build number stamped by the `version` patch step).
version_label: DE.2.1.0

# Extra glyphs the font must render beyond plain ASCII.
font_glyphs: "äöüßÄÖÜ"

# In-game status-condition abbreviations (official DE localisation).
status_abbrev:
  poison: GIF
  burn: VBR
  freeze: GEF
  paralysis: PAR
  sleep: SCH
  faint: KO

# Post-build patches applied by scripts/build_language.py.
# `font` runs patch_font_de.py which draws ä ö ü Ä Ö Ü glyphs.
#
# Anti-freeze / anti-corruption (language-agnostic mechanics — always applied):
#   repair_lz77            restore stable EN=ES LZ77 UI blocks corrupted by the builder
#   repair_localized_lz77  copy localized (EN≠ES) LZ77 blocks from the Spanish ROM
#   repoint_stale          re-target text pointers reverted by the LZ77 repair passes
#   legendary_ritual       restore Ho-Oh/Lugia cutscene setflag chain clobbered by repointer
#
# Language-aware (data already in status_abbrev above):
#   status_abbrevs         write DE status abbreviations (GIF/VBR/GEF/SCH/…) into ROM
#   status_badges          redraw the in-battle status badge tiles (LZ77 graphics)
#                          with DE glyphs (GIF/SCH/GEF/VBR/KO) — the graphical
#                          counterpart of the text status_abbrevs above
#   hp_labels              redraw the HP-label graphics (party menu + summary bar
#                          + summary grey stat label — all LZ77 tiles, not text)
#                          with the German « KP » (Kraftpunkte)
#   dexnav_headers         redraw the 4 DexNav column-header graphics (custom
#                          Unbound LZ77 tileset, not text) with German labels
#                          (SUCHLEVEL / METHODE / VERST. FAEH. / ITEMS)
#   version                stamp the NOT FOR SALE screen with DE.2.1.<build>
#                          so the running build advertises it is the German one
#
# Battle-text / control-code-timing / positional-gender-buffer patches
# (ported from the FR pipeline; see patch_<name>_de.py for German-specific
# rationale — some, like battle_prefix, need no cave hack in German because
# the language's natural word order already matches the engine's layout):
#   gendered_buffers         fixed-size buffer strings (son/daughter/boy/girl/
#                            man/lady/her) patched to German where they fit
#   battle_prefix            report-only guard for the wild/foe name-prefix
#                            cells (no reorder cave needed in German)
#   givecs_gift_item         restore the give-CS gift-item struct from English
#                            (except the localized name prefix) to prevent it
#                            silently diverging if a translation overflows it
#   battle_string_templates  restore the language-neutral defeat-speech /
#                            switch-out control-code cluster from English
#   battle_recall_strings    German "komm/kommt zurück!" switch-out messages,
#                            relocated via their external pointer table
#
# Inline code patches (not text data, no combined-file entry possible):
#   time_format             24h clock + DD.MM.YYYY save/date templates, DE weekday
#                            (So./Mo./…) and month-abbreviation cells
#   trainer_card_date       rebuilds the Trainer Card start date in Day Month Year
#                            order via a free-space builder + veneer redirect
#
# Further richer passes (mission boxes, move descriptions, ability/item
# pointer-relocated names, …) will be added here as more German translation
# content is ported from the French pipeline.
patches:
  - gendered_buffers
  - font
  - time_format
  - inline
  - battle_prefix
  - repair_lz77
  - repair_localized_lz77
  - repoint_stale
  - legendary_ritual
  - givecs_gift_item
  - status_abbrevs
  - battle_string_templates
  - battle_recall_strings
  - status_badges
  # Redraw the move-type badges (graphic tiles) with German names
  # (KAMPF/GIFT/DRACHE/…) via scripts/patch_type_icons_de.py.
  - type_icons
  # Redraw the HP-label graphics (LZ77 tiles) with German « KP » (Kraftpunkte)
  # via scripts/patch_hp_labels_de.py.
  - hp_labels
  # Redraw the 4 DexNav column-header graphics (custom Unbound LZ77 tileset)
  # with German labels (SUCHLEVEL / METHODE / VERST. FAEH. / ITEMS) via
  # scripts/patch_dexnav_headers_de.py.
  - dexnav_headers
  - version
  # Fixed-width name/description tables carrying baked official German
  # localisation content (Berries/items, natures, CFRU type names, Pokédex
  # category table + ordering + metric units, summary-screen labels, options
  # footer, shop strings, PC box messages). See scripts/patch_<name>_de.py.
  - item_names
  - nature_names
  - cfru_type_names
  - pokedex_categories
  - pokedex_category_order
  - pokedex_metrics
  - pokedex_rewrap
  - summary_labels
  - options_footer
  - shop
  - pc_messages
  - trainer_card_date
  # Post-build audit: flag any translated cell not terminated before its
  # neighbour (fusion / freeze risk). Report-only, never fails the build.
  - collision_check
