scope_guard:
  forbidden_prefixes:
    - languages/fr/
    - languages/it/
  forbidden_rom_globs:
    - output/roms/GenedRom-fr.gba
    - output/roms/GenedRom-it.gba
    - output/release/*fr*.gba
    - output/release/*it*.gba
    - output/release/*fr*.zip
    - output/release/*it*.zip
  shared_prefixes:
    - src/
    - scripts/
    - Makefile
    - .githooks/
