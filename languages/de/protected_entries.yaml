# Entrées protégées DE — SOURCE DE VÉRITÉ des corrections validées (issues/tickets).
#
# scripts/check_translation_integrity.py vérifie que combined_de.txt (règle
# last-wins, comme la chaîne de build) résout chaque offset EXACTEMENT à
# `expected` (ou qu'il reste ABSENT si `absent: true`). Toute divergence fait
# échouer le pre-commit (make test-python-fast) ET make build-de.
#
# - Correction volontaire d'une entrée protégée → mettre à jour `expected` ici
#   DANS LE MÊME COMMIT que combined_de.txt.
# - Fix perdu (snapshot périmé, Pattern C) → python3 scripts/check_translation_integrity.py --fix --lang de
# - Toute entrée déjà perdue une fois par un commit périmé DOIT être ajoutée ici.
#
# Format d'une entrée :
#   - offset: "0x123456"
#     name: "Description courte"
#     issue: "#NN"                       # optionnel
#     expected: 'Texte exact attendu'    # quoting simple : \n reste littéral
#     forbidden: ['Forme périmée']       # optionnel, message d'erreur plus clair
#   # ou, pour un offset qui doit rester absent du fichier :
#   - offset: "0x123456"
#     name: "..."
#     absent: true
#
# Voir docs/20_TRANSLATION_PRESERVATION.md §7.
entries:
- offset: '0x1f47086'
  name: 'Jax: Fähre nach Polderive außer Betrieb'
  expected: Was soll das heißen, das Schiff fährt nicht?\pWir müssen so schnell wie möglich nach Polderive!\pDas Schicksal von Borrius hängt davon ab!
  forbidden:
  - What do you mean, the ship's not running?
- offset: '0x1f4725d'
  name: 'Brice: schnelle Überfahrt'
  expected: Wenn wir damit schnell hinkommen, machen wir das.
  forbidden:
  - If that'll get us there quickly, let's do that.
- offset: '0x1f4728d'
  name: 'Jax: Treffpunkt an den Docks und Fahrkarte'
  expected: Hast du das verstanden, <0xFD><0x01>?\pTriff uns am Boot an den Docks nördlich von hier.\pWir gehen schon vor und gehen ohne dich an Bord, damit es keine Verzögerung gibt.\pAch ja - nimm diese Fahrkarte, damit du auch aufs Boot kommst.
  forbidden:
  - Meet us at the boat on the docks north of here.
- offset: '0x1f53396'
  name: 'PNJ Fähre: Fahrplan der S.S. Marine'
  expected: Wenn sie in Betrieb ist, fährt die S.S. Marine sonntags und mittwochs nach West-Borrius.
  forbidden:
  - When it's working, the S.S. Marine sets sail to West Borrius on Sundays and Wednesdays.
- offset: '0x1F53F7C'
  name: 'PNJ Centre Pokémon (chambre): Fulica-Sumpf wenige Käfer-Pokémon'
  issue: B-303
  expected: Für einen Sumpf hat der <0xFC><0x01><0x06>Fulica-Sumpf<0xFC><0x01><0x08>\nüberraschenderweise nicht viele\lKäfer-Pokémon.
  forbidden:
  - Cootes Bog
- offset: '0x1f53c21'
  name: 'PNJ Safari Zone : partenaire capturé'
  issue: B-308
  expected: 'Ich habe meinen geliebten Partner\nin der <0xFC><0x01><0x06>Safari-Zone<0xFC><0x01><0x08> gefangen.\pSie liegt gleich <0xFC><0x01><0x06>östlich<0xFC><0x01><0x08> der Stadt.'
- offset: '0x1f53c7d'
  name: 'PNJ Safari Zone : changement et Wesen Pokémon'
  issue: B-308
  expected: 'Wir können unverändert leben,\nweil wir uns immer verändern.\pIch meine, auch Pokémon entwickeln sich,\naber ihre Wesen bleiben gleich.\pZumindest sollte es so sein...'
