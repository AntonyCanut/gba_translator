# scripts/check_translation_integrity.py vérifie que combined_fr.txt (règle
# last-wins, comme la chaîne de build) résout chaque offset EXACTEMENT à
# `expected` (ou qu'il reste ABSENT si `absent: true`). Toute divergence fait
# échouer le pre-commit (make test-python-fast) ET make build-fr.
#
# - Correction volontaire d'une entrée protégée → mettre à jour `expected` ici
#   DANS LE MÊME COMMIT que combined_fr.txt.
# - Fix perdu (snapshot périmé, Pattern C) → python3 scripts/check_translation_integrity.py --fix
# - Toute entrée déjà perdue une fois par un commit périmé DOIT être ajoutée ici.
#
# Voir docs/20_TRANSLATION_PRESERVATION.md §7.
