<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GBA Emulator - mGBA Backend</title>
  <style>
    body { margin: 0; background: #111; color: #eee; font-family: monospace; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    #screen { border: 2px solid #444; image-rendering: pixelated; background: #000; }
    #status { margin-top: 10px; font-size: 14px; }
    #log { margin-top: 10px; max-height: 200px; overflow-y: auto; font-size: 12px; white-space: pre-wrap; width: 480px; background: #222; padding: 8px; border-radius: 4px; }
  </style>
</head>
<body>
  <canvas id="screen" width="240" height="160"></canvas>
  <div id="status">mGBA Backend — Connecting...</div>
  <div id="log"></div>

  <script>
    const canvas = document.getElementById('screen');
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');

    function log(msg) {
      const line = `[${new Date().toISOString().slice(11,23)}] ${msg}`;
      logEl.textContent += line + '\n';
      logEl.scrollTop = logEl.scrollHeight;
    }

    function connectWebSocket() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${location.host}/ws?role=browser`;
      log(`Connecting to ${wsUrl}`);

      const ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        log('WebSocket connected');
        statusEl.textContent = 'Connected — mGBA backend active';
        // Signal to fixture that we are ready
        log('ROM loaded successfully');
      };

      ws.onclose = () => {
        log('WebSocket disconnected, reconnecting in 1s...');
        statusEl.textContent = 'Disconnected — Reconnecting...';
        setTimeout(connectWebSocket, 1000);
      };

      ws.onerror = (err) => {
        log(`WebSocket error: ${err.type}`);
      };
    }

    connectWebSocket();
    log('GBA Emulator Web initialized (mGBA backend)');
  </script>
</body>
</html>
