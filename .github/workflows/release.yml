name: Build & Release ROMs (FR + IT)

on:
  push:
    branches: [unbound, master]
  workflow_dispatch:

jobs:
  release:
    name: Build French + Italian ROMs & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # ── French (dedicated byte-perfect recipe) ──────────────────────────────
      - name: Build French ROM
        run: make build-fr BUILD_NUMBER=${{ github.run_number }}

      - name: Verify FR version display
        # Regression guard (B-19 / T-21): the FR ROM must show
        # FR.2.0.<run_number> on the NOT FOR SALE screen and stamp the header.
        run: |
          python3 scripts/verify_version_display.py \
            --rom output/roms/GenedRom-fr.gba \
            --lang-code fr \
            --build-number ${{ github.run_number }}

      # ── Italian (generic driver) ────────────────────────────────────────────
      - name: Build Italian ROM
        run: make build-it BUILD_NUMBER=${{ github.run_number }}

      - name: Verify IT version display
        # The Italian build must advertise itself: the NOT FOR SALE screen
        # shows IT.2.0.<run_number> (not FR) so players can tell the builds apart.
        run: |
          python3 scripts/verify_version_display.py \
            --rom output/roms/GenedRom-it.gba \
            --lang-code it \
            --build-number ${{ github.run_number }}

      # ── Publish both ROMs in a single release ───────────────────────────────
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          MSG=$(git log -1 --pretty=%s)
          NOTES=$(printf '**Commit :** `%s` — %s\n\nBuildé automatiquement depuis la branche `%s` (build #%s).\n\n- 🇫🇷 `pokemon_unbound_fr.gba` — FR.2.0.%s\n- 🇮🇹 `pokemon_unbound_it.gba` — IT.2.0.%s' \
            "${SHA}" "${MSG}" "${GITHUB_REF_NAME}" "${{ github.run_number }}" "${{ github.run_number }}" "${{ github.run_number }}")

          # Suppress error if 'latest' release/tag doesn't exist yet
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          gh release create latest \
            --title "FR/IT.2.0.${{ github.run_number }}" \
            --notes "${NOTES}" \
            --prerelease \
            "output/roms/GenedRom-fr.gba#pokemon_unbound_fr.gba" \
            "output/roms/GenedRom-it.gba#pokemon_unbound_it.gba"
