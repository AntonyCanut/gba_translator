name: Build & Release ROMs (FR + IT + DE)

on:
  push:
    branches: [unbound, master]
  workflow_dispatch:

jobs:
  # Each language builds in its own parallel job instead of one long sequential
  # job. FR is mandatory (no continue-on-error): if it fails, the "build" job
  # fails and the release job below refuses to publish. IT/DE are best-effort
  # so a transient problem in either never blocks the proven FR release.
  build:
    name: Build ${{ matrix.lang_label }} ROM
    runs-on: ubuntu-latest
    continue-on-error: ${{ !matrix.mandatory }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: fr
            lang_label: French
            mandatory: true
          - lang: it
            lang_label: Italian
            mandatory: false
          - lang: de
            lang_label: German
            mandatory: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # French uses a dedicated byte-perfect recipe. The trilingual CSV is
      # gitignored, so the translation JSON must be regenerated in CI.
      - name: Prepare French translation JSON
        if: matrix.lang == 'fr'
        run: make prepare-fr

      - name: Build ${{ matrix.lang_label }} ROM
        run: make build-${{ matrix.lang }} BUILD_NUMBER=${{ github.run_number }}

      - name: Verify ${{ matrix.lang_label }} version display
        # Regression guard (B-19 / T-21): each ROM must show
        # <LANG>.2.1.<run_number> on the NOT FOR SALE screen and stamp the header.
        run: |
          python3 scripts/verify_version_display.py \
            --rom output/roms/GenedRom-${{ matrix.lang }}.gba \
            --lang-code ${{ matrix.lang }} \
            --build-number ${{ github.run_number }}

      - name: Upload ${{ matrix.lang_label }} ROM artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rom-${{ matrix.lang }}
          path: output/roms/GenedRom-${{ matrix.lang }}.gba

  # Final join: wait for every language build, then assemble whatever landed.
  release:
    name: Publish release
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download ROM artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: rom-*
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          MSG=$(git log -1 --pretty=%s)
          RUN=${{ github.run_number }}

          if [ ! -f artifacts/rom-fr/GenedRom-fr.gba ]; then
            echo "::error::French ROM artifact missing — FR build must succeed for a release to be published."
            exit 1
          fi

          ASSETS=( "artifacts/rom-fr/GenedRom-fr.gba#pokemon_unbound_fr.gba" )
          NOTES=$(printf '**Commit :** `%s` — %s\n\nBuildé automatiquement depuis la branche `%s` (build #%s).\n\n- 🇫🇷 `pokemon_unbound_fr.gba` — FR.2.1.%s' \
            "${SHA}" "${MSG}" "${GITHUB_REF_NAME}" "${RUN}" "${RUN}")

          if [ -f artifacts/rom-it/GenedRom-it.gba ]; then
            ASSETS+=( "artifacts/rom-it/GenedRom-it.gba#pokemon_unbound_it.gba" )
            NOTES="${NOTES}"$(printf '\n- 🇮🇹 `pokemon_unbound_it.gba` — IT.2.1.%s' "${RUN}")
          else
            NOTES="${NOTES}"$(printf '\n- 🇮🇹 build italienne indisponible pour ce build.')
          fi

          if [ -f artifacts/rom-de/GenedRom-de.gba ]; then
            ASSETS+=( "artifacts/rom-de/GenedRom-de.gba#pokemon_unbound_de.gba" )
            NOTES="${NOTES}"$(printf '\n- 🇩🇪 `pokemon_unbound_de.gba` — DE.2.1.%s' "${RUN}")
          else
            NOTES="${NOTES}"$(printf '\n- 🇩🇪 build allemande indisponible pour ce build.')
          fi

          # Suppress error if 'latest' release/tag doesn't exist yet
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          gh release create latest \
            --title "Unbound 2.1.${RUN}" \
            --notes "${NOTES}" \
            --prerelease \
            "${ASSETS[@]}"

      # ── Surface an IT/DE failure AFTER FR has shipped ───────────────────────
      - name: Fail if Italian ROM was not delivered
        run: |
          if [ ! -f artifacts/rom-it/GenedRom-it.gba ]; then
            echo "::error::Italian ROM build/verify failed — FR was still released, but IT was skipped."
            exit 1
          fi

      - name: Fail if German ROM was not delivered
        run: |
          if [ ! -f artifacts/rom-de/GenedRom-de.gba ]; then
            echo "::error::German ROM build/verify failed — FR was still released, but DE was skipped."
            exit 1
          fi
