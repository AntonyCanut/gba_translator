name: Build & Release ROM FR

on:
  push:
    branches: [unbound, master]
  workflow_dispatch:

jobs:
  release-fr:
    name: Build French ROM & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Build French ROM
        run: make build-fr BUILD_NUMBER=${{ github.run_number }}

      - name: Upgrade gh CLI (needs ≥2.55.0 for --no-source-archives)
        run: |
          GH_VERSION=$(curl -sSL -o /dev/null -w '%{url_effective}' https://github.com/cli/cli/releases/latest | sed 's|.*/v||')
          curl -sSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp
          sudo install -m 755 "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" /usr/local/bin/gh
          gh --version

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          MSG=$(git log -1 --pretty=%s)
          NOTES=$(printf '**Commit :** `%s` — %s\n\nBuildé automatiquement depuis la branche `%s` (build #%s).' \
            "${SHA}" "${MSG}" "${GITHUB_REF_NAME}" "${{ github.run_number }}")

          # Suppress error if 'latest' release/tag doesn't exist yet
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          gh release create latest \
            --title "FR.2.0.${{ github.run_number }}" \
            --notes "${NOTES}" \
            --prerelease \
            --no-source-archives \
            "output/roms/GenedRom-fr.gba#pokemon_unbound_fr.gba"
