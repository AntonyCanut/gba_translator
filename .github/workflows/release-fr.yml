name: Build & Release ROM FR

on:
  push:
    branches: [unbound, master]
  workflow_dispatch:

jobs:
  release-fr:
    name: Build French ROM & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Build French ROM
        run: make build-fr BUILD_NUMBER=${{ github.run_number }}

      - name: Upgrade gh CLI (needs ≥2.55.0 for --no-source-archives)
        run: |
          sudo mkdir -p -m 755 /etc/apt/keyrings
          wget -qO- https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
          sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update && sudo apt install gh -y

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          MSG=$(git log -1 --pretty=%s)
          NOTES=$(printf '**Commit :** `%s` — %s\n\nBuildé automatiquement depuis la branche `%s` (build #%s).' \
            "${SHA}" "${MSG}" "${GITHUB_REF_NAME}" "${{ github.run_number }}")

          # Suppress error if 'latest' release/tag doesn't exist yet
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          gh release create latest \
            --title "FR.2.0.${{ github.run_number }}" \
            --notes "${NOTES}" \
            --prerelease \
            --no-source-archives \
            "output/roms/GenedRom-fr.gba#pokemon_unbound_fr.gba"
