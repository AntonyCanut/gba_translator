name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  python-tests-fast:
    name: Python Tests (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run fast unit tests
        run: |
          python3 -m pytest tests/ -x -q \
            --ignore=tests/benchmarks \
            --ignore=tests/stress \
            --ignore=tests/e2e \
            -m "not slow and not emulator and not rom" \
            -v --junitxml=test-results/fast-results.xml

      - name: Verify test collection
        run: python3 -m pytest tests/ --collect-only -q 2>&1 | tail -5

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-test-results
          path: test-results/fast-results.xml

  python-tests-standard:
    name: Python Tests (standard)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run standard tests
        run: |
          python3 -m pytest tests/ \
            -m "not emulator and not stress and not benchmark and not rom" \
            -v --junitxml=test-results/standard-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standard-test-results
          path: test-results/standard-results.xml

  charmap-sync:
    name: Charmap Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check charmap synchronisation
        run: python3 scripts/sync_charmap.py --check

  patch-bundle:
    name: Tracked BPS Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Validate tracked patches without ROM
        run: python3 scripts/verify_patch_bundle.py patches --required fr it de indie

  emulator-web-tests:
    name: Emulator Web Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: emulator-web
        run: npm ci

      - name: Run Vitest
        working-directory: emulator-web
        run: npx vitest run
