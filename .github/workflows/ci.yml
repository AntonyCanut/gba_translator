name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  python-tests-fast:
    name: Python Tests (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run fast unit tests
        run: |
          python3 -m pytest tests/ -x -q \
            --ignore=tests/benchmarks \
            --ignore=tests/stress \
            --ignore=tests/e2e \
            -m "not slow and not emulator and not rom" \
            -v --junitxml=test-results/fast-results.xml

      - name: Verify test collection
        run: python3 -m pytest tests/ --collect-only -q 2>&1 | tail -5

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-test-results
          path: test-results/fast-results.xml

  python-tests-standard:
    name: Python Tests (standard)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run standard tests
        run: |
          python3 -m pytest tests/ \
            -m "not emulator and not stress and not benchmark and not rom" \
            -v --junitxml=test-results/standard-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standard-test-results
          path: test-results/standard-results.xml

  charmap-sync:
    name: Charmap Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check charmap synchronisation
        run: python3 scripts/sync_charmap.py --check

  python-tests-rom:
    name: Python Tests (private ROMs)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Download and verify private ROM inputs
        env:
          UNBOUND_ENGLISH_ROM_URL: ${{ secrets.UNBOUND_ENGLISH_ROM_URL }}
          UNBOUND_PATCHED_FRENCH_ROM_URL: ${{ secrets.UNBOUND_PATCHED_FRENCH_ROM_URL }}
          UNBOUND_SPANISH_ROM_URL: ${{ secrets.UNBOUND_SPANISH_ROM_URL }}
        run: |
          test -n "${UNBOUND_ENGLISH_ROM_URL}" || { echo "::error::UNBOUND_ENGLISH_ROM_URL is missing"; exit 1; }
          test -n "${UNBOUND_PATCHED_FRENCH_ROM_URL}" || { echo "::error::UNBOUND_PATCHED_FRENCH_ROM_URL is missing"; exit 1; }
          test -n "${UNBOUND_SPANISH_ROM_URL}" || { echo "::error::UNBOUND_SPANISH_ROM_URL is missing"; exit 1; }
          mkdir -p input/roms
          curl --fail --location --retry 3 --silent --show-error \
            "${UNBOUND_ENGLISH_ROM_URL}" --output input/roms/englishrom.gba
          curl --fail --location --retry 3 --silent --show-error \
            "${UNBOUND_PATCHED_FRENCH_ROM_URL}" --output input/roms/patchedfrenchrom.gba
          curl --fail --location --retry 3 --silent --show-error \
            "${UNBOUND_SPANISH_ROM_URL}" --output input/roms/spanishrom.gba
          make verify-roms

      - name: Build French ROM locally
        run: |
          make prepare-fr
          make build-all BUILD_NUMBER=${{ github.run_number }}

      - name: Run ROM tests
        run: |
          python3 -m pytest tests/ \
            -m "rom and not emulator and not stress and not benchmark" -v

  emulator-web-tests:
    name: Emulator Web Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: emulator-web
        run: npm ci

      - name: Run Vitest
        working-directory: emulator-web
        run: npx vitest run

  playwright-tests:
    name: Playwright Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [emulator-web-tests, charmap-sync]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Download and verify private ROM inputs
        env:
          UNBOUND_ENGLISH_ROM_URL: ${{ secrets.UNBOUND_ENGLISH_ROM_URL }}
          UNBOUND_PATCHED_FRENCH_ROM_URL: ${{ secrets.UNBOUND_PATCHED_FRENCH_ROM_URL }}
          UNBOUND_SPANISH_ROM_URL: ${{ secrets.UNBOUND_SPANISH_ROM_URL }}
        run: |
          test -n "${UNBOUND_ENGLISH_ROM_URL}" || { echo "::error::UNBOUND_ENGLISH_ROM_URL is missing"; exit 1; }
          test -n "${UNBOUND_PATCHED_FRENCH_ROM_URL}" || { echo "::error::UNBOUND_PATCHED_FRENCH_ROM_URL is missing"; exit 1; }
          test -n "${UNBOUND_SPANISH_ROM_URL}" || { echo "::error::UNBOUND_SPANISH_ROM_URL is missing"; exit 1; }
          mkdir -p input/roms
          curl --fail --location --retry 3 --silent --show-error \
            "${UNBOUND_ENGLISH_ROM_URL}" --output input/roms/englishrom.gba
          curl --fail --location --retry 3 --silent --show-error \
            "${UNBOUND_PATCHED_FRENCH_ROM_URL}" --output input/roms/patchedfrenchrom.gba
          curl --fail --location --retry 3 --silent --show-error \
            "${UNBOUND_SPANISH_ROM_URL}" --output input/roms/spanishrom.gba
          make verify-roms

      - name: Build French ROM locally
        run: |
          make prepare-fr
          make build-fr BUILD_NUMBER=${{ github.run_number }}

      - name: Install root Node dependencies
        run: npm ci

      - name: Install emulator-web dependencies
        working-directory: emulator-web
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/reports/
